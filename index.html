<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reforma Casa Nova — Pinterest</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }

    .widget-shell {
      width: 100%;
      min-height: 640px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: auto;
      padding: 8px;
    }

    .widget {
      width: 1000px;
      max-width: 100%;
      min-height: 620px;
      text-align: center;
    }

    .fallback {
      margin: 16px 0;
      font-size: 14px;
    }

    .fallback a {
      color: inherit;
    }

    @media (max-width: 760px) {
      .widget-shell {
        min-height: 560px;
        padding: 4px;
      }

      .widget {
        min-height: 540px;
      }
    }
  </style>
</head>
<body>
  <main class="widget-shell">
    <section class="widget" aria-label="Board Reforma Casa Nova no Pinterest">
      <a
        data-pin-do="embedBoard"
        data-pin-board-width="1000"
        data-pin-scale-height="600"
        data-pin-scale-width="160"
        href="https://br.pinterest.com/erickcdecampos/reforma-casa-nova/"
      >
        Ver o board “Reforma Casa Nova” no Pinterest
      </a>

      <noscript>
        <p class="fallback">
          <a
            href="https://br.pinterest.com/erickcdecampos/reforma-casa-nova/"
            target="_blank"
            rel="noopener noreferrer"
          >
            Abrir o board “Reforma Casa Nova” no Pinterest
          </a>
        </p>
      </noscript>
    </section>
  </main>

  <script
    async
    defer
    src="https://assets.pinterest.com/js/pinit.js"
  ></script>
</body>
</html>
