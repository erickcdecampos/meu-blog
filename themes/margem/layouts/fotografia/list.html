{{ define "main" }}
  {{- $albums := where .Pages "Draft" false }}
  <header class="foto-header">
    <h1 class="foto-title">Fotografia</h1>
    <span class="foto-meta">
      {{ len $albums }}&thinsp;{{ if eq (len $albums) 1 }}álbum{{ else }}álbuns{{ end }}
    </span>
  </header>

  <div class="albums-grid">
    {{ range $albums.ByDate.Reverse }}
      {{ partial "album-card.html" . }}
    {{ end }}
  </div>
{{ end }}
