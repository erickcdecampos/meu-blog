{{ define "main" }}
  <div class="feed-header">
    <span class="feed-label">Recentes</span>
  </div>

  <div class="post-list">
    {{ $pages := where .Site.RegularPages "Section" "in" .Site.Params.mainSections }}
    {{ range $pages.ByDate.Reverse }}
      {{ if not .Draft }}
        {{ partial "post-card.html" . }}
      {{ end }}
    {{ end }}
  </div>
{{ end }}
